<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>焦点清单</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --bg-canvas: #edf3fc;
      --bg-glass: rgba(255, 255, 255, 0.90);
      --bg-glass-hover: rgba(255, 255, 255, 0.98);
      --bg-glass-active: #e2ecf9;
      --bg-input: rgba(255, 255, 255, 0.96);
      
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-disabled: #94a3b8;
      
      --line-glass: rgba(218, 226, 237, 0.88);
      --line-border: #cbd5e1;
      --line-focus: #2563eb;
      
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --primary-text: #1d4ed8;
      
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #15803d;
      
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --warning-border: #fde68a;
      --warning-text: #b45309;
      
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #b91c1c;

      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 4px 14px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 8px 20px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.03);

      --duration: 150ms;
      --ease: ease-out;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      height: 100%;
      background: #eef4fd;
      overflow-y: auto;
      overflow-x: hidden;
    }
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, #e0ecfb 0%, transparent 45%),
        linear-gradient(155deg, #f8faff 0%, #ebf2fb 100%);
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* 现代透光极简滚动条 */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.6);
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; border: none; background: none; cursor: pointer; }
    button:focus { outline: none; }
    button:focus-visible {
      outline: 2px solid rgba(37, 99, 235, 0.24);
      outline-offset: 2px;
    }

    .shell {
      width: 100%;
      min-height: 100vh;
      padding: 10px 14px 24px;
      max-width: 640px;
      margin: 0 auto;
    }

    .window-toolbar {
      display: flex;
      align-items: center;
      min-height: 28px;
      margin: 0 2px 8px;
    }

    .window-drag-surface {
      flex: 1;
      align-self: stretch;
      cursor: grab;
      touch-action: none;
      display: flex;
      align-items: center;
      outline: none !important;
      box-shadow: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .window-drag-surface:active { cursor: grabbing; }

    .window-drag-mark {
      width: 20px;
      height: 3px;
      border-radius: var(--radius-full);
      background: rgba(100, 116, 139, 0.38);
    }

    .window-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .window-action {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(203, 213, 225, 0.76);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.46);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      transition: background-color var(--duration) var(--ease), border-color var(--duration) var(--ease), color var(--duration) var(--ease);
    }

    .window-action:hover {
      background: rgba(255, 255, 255, 0.88);
      border-color: var(--line-border);
      color: var(--text-main);
    }

    .window-action.active {
      border-color: var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .window-action.close-window:hover {
      border-color: var(--danger-border);
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* 顶部精简状态条 Top Status Bar */
    .top-status-bar {
      background: var(--bg-glass);
      border: 1px solid var(--line-glass);
      border-radius: var(--radius-xl);
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .focus-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #e8f0ff;
      color: var(--primary);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .status-left {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .status-kicker {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-date {
      font-size: 14px;
      font-weight: 650;
      color: var(--text-main);
      white-space: nowrap;
    }

    .status-side {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .progress-track {
      flex: 1;
      width: 64px;
      height: 5px;
      background: #e8edf5;
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: var(--radius-full);
      width: 0%;
      transition: width 200ms var(--ease);
    }

    .status-percent {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      background: #f7f9fc;
      border: 1px solid var(--line-glass);
      border-radius: 11px;
      padding: 5px 7px;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .status-pill strong {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
    }

    /* 任务创建栏 Composer */
    .composer {
      background: var(--bg-glass);
      border: 1px solid var(--line-glass);
      border-radius: var(--radius-xl);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
      display: grid;
      gap: 8px;
    }

    .composer-input-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 8px;
      align-items: center;
    }

    .composer input[type="text"] {
      width: 100%;
      border: 1px solid var(--line-border);
      border-radius: 14px;
      background: var(--bg-input);
      color: var(--text-main);
      min-height: 42px;
      padding: 9px 13px;
      font-size: 13.5px;
      outline: none;
      transition: border-color var(--duration) var(--ease), background-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
    }

    .composer input[type="text"]::placeholder {
      color: var(--text-disabled);
    }

    .composer input[type="text"]:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: none;
    }

    .add-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--primary);
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.18);
      transition: background-color var(--duration) var(--ease), border-color var(--duration) var(--ease), transform var(--duration) var(--ease);
      flex-shrink: 0;
      outline: none;
    }

    .add-btn:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .add-btn:active {
      transform: scale(0.98) translateY(0);
    }

    .add-btn:focus-visible {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .composer-options {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .opt-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-input);
      border: 1px solid var(--line-border);
      border-radius: 12px;
      padding: 6px 9px;
      color: var(--text-secondary);
      font-size: 11px;
      outline: none;
      transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease), background-color var(--duration) var(--ease);
    }

    .opt-pill:hover {
      border-color: var(--text-muted);
      background: #ffffff;
    }

    .opt-pill:focus-within {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .opt-pill input[type="date"] {
      border: 0;
      background: transparent;
      outline: 0;
      color: var(--text-main);
      font-size: 11.5px;
      cursor: pointer;
      padding: 0;
    }

    .priority-picker {
      position: relative;
      z-index: 20;
    }

    .priority-trigger {
      min-width: 92px;
      justify-content: space-between;
      cursor: pointer;
    }

    .priority-trigger:focus-within,
    .priority-trigger:focus-visible {
      border-color: var(--primary);
      box-shadow: none;
    }

    .priority-trigger svg:last-child {
      transition: transform var(--duration) var(--ease);
    }

    .priority-picker.open .priority-trigger {
      border-color: var(--primary);
      box-shadow: none;
    }

    .priority-picker.open .priority-trigger svg:last-child {
      transform: rotate(180deg);
    }

    .priority-menu {
      position: absolute;
      top: calc(100% + 7px);
      left: 0;
      min-width: 112px;
      padding: 5px;
      border: 1px solid var(--line-glass);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: var(--shadow-md);
      display: grid;
      gap: 2px;
    }

    .priority-menu[hidden] { display: none; }

    .priority-option {
      width: 100%;
      padding: 7px 9px;
      border-radius: 9px;
      color: var(--text-secondary);
      font-size: 11.5px;
      text-align: left;
    }

    .priority-option:hover, .priority-option.selected {
      background: var(--primary-soft);
      color: var(--primary-text);
    }

    .priority-option.selected { font-weight: 600; }

    /* 标签导航：悬浮按钮之间保留呼吸感，不再承托在一整块底板上 */
    .tabs-wrapper {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, #eef4fd 0%, rgba(238, 244, 253, 0.95) 75%, rgba(238, 244, 253, 0) 100%);
      padding: 4px 0 10px;
      margin-bottom: 4px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: transparent;
      padding: 0;
      border: 0;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 34px;
      padding: 6px 4px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background-color var(--duration) var(--ease), border-color var(--duration) var(--ease), color var(--duration) var(--ease), transform var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
      outline: none;
      box-shadow: none;
    }

    .tab:hover {
      background: #ffffff;
      border-color: var(--line-glass);
      box-shadow: var(--shadow-sm);
      color: var(--text-main);
    }

    .tab:active {
      transform: scale(0.98);
    }

    .tab:focus-visible {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .tab.active {
      background: #ffffff;
      border: 1px solid var(--primary-border);
      color: var(--primary);
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.07);
    }

    .tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border: 1px solid var(--line-glass);
      border-radius: var(--radius-full);
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1;
      transition: all var(--duration) var(--ease);
    }

    .tab.active .tab-count {
      border-color: var(--primary-border);
      background: #ffffff;
      color: var(--primary);
    }

    /* 垂直时间线布局 Vertical Timeline */
    .timeline {
      position: relative;
      padding: 6px 0 18px 28px;
      min-height: 100px;
    }

    /* 垂直主连接线（中心对齐于 x=7px） */
    .timeline-line {
      position: absolute;
      left: 6px;
      top: 14px;
      bottom: 24px;
      width: 2px;
      background: #dce4ef;
      border-radius: var(--radius-full);
      pointer-events: none;
    }

    .timeline-list {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .task-item {
      position: relative;
    }

    /* 时间线节点圆点（尺寸 14x14，中心严格对齐 x=7px） */
    .timeline-node {
      position: absolute;
      left: -28px;
      top: 14px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid var(--primary);
      box-shadow: 0 0 0 2px #ffffff;
      transition: box-shadow var(--duration) var(--ease), border-color var(--duration) var(--ease), background-color var(--duration) var(--ease);
      z-index: 2;
    }

    .timeline-node.node-completed {
      border-color: var(--success);
      background: var(--success);
    }

    .timeline-node.node-overdue,
    .timeline-node.node-high {
      border-color: var(--danger);
    }

    .timeline-node.node-normal {
      border-color: var(--primary);
    }

    .timeline-node.node-low {
      border-color: var(--text-disabled);
    }

    /* 节点光晕高亮 */
    .task-item:hover .timeline-node {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .task-item:hover .timeline-node.node-completed {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px rgba(22, 163, 74, 0.15);
    }

    .task-item:hover .timeline-node.node-overdue,
    .task-item:hover .timeline-node.node-high {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px rgba(220, 38, 38, 0.15);
    }

    /* 任务卡片 Card */
    .task-card {
      background: var(--bg-glass);
      border: 1px solid var(--line-glass);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease), background-color var(--duration) var(--ease), transform var(--duration) var(--ease);
    }

    .task-card:hover {
      background: var(--bg-glass-hover);
      border-color: var(--line-border);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .task-item.completed .task-card {
      background: #f7f9fc;
      opacity: 0.92;
    }

    .task-main-row {
      display: grid;
      grid-template-columns: 20px 1fr auto;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
    }

    /* 自定义复选框 */
    .checkbox-wrap {
      padding-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check {
      appearance: none;
      width: 18px;
      height: 18px;
      margin: 0;
      border: 1.5px solid var(--line-border);
      border-radius: 7px;
      background: #ffffff;
      cursor: pointer;
      position: relative;
      transition: border-color var(--duration) var(--ease), background-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
      display: grid;
      place-content: center;
      outline: none;
    }

    .check:hover {
      border-color: var(--primary);
    }

    .check:focus-visible {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .check:checked {
      border-color: var(--success);
      background: var(--success);
    }

    .check:checked::after {
      content: "";
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    /* 任务主体内容 */
    .task-body {
      min-width: 0;
      cursor: pointer;
      outline: none;
    }

    .task-body:focus-visible {
      border-radius: var(--radius-md);
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .task-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.45;
      overflow-wrap: anywhere;
      transition: color var(--duration) var(--ease);
    }

    .task-item.completed .task-title {
      color: var(--text-disabled);
      text-decoration: line-through;
      font-weight: 400;
    }

    .task-note-preview {
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      background: #f7f9fc;
      border: 1px solid var(--line-glass);
      padding: 4px 8px;
      border-radius: 10px;
    }

    /* 徽章 Meta Badges (圆边框矩形标签) */
    .task-meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      border: 1px solid transparent;
      background: #ffffff;
    }

    .badge-date {
      color: var(--text-secondary);
      border-color: var(--line-glass);
    }

    .badge-date.overdue {
      background: var(--danger-soft);
      color: var(--danger-text);
      border-color: var(--danger-border);
      font-weight: 600;
    }

    .badge-date.today {
      background: var(--primary-soft);
      color: var(--primary-text);
      border-color: var(--primary-border);
    }

    .badge-priority.high {
      background: var(--danger-soft);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }

    .badge-priority.normal {
      background: var(--primary-soft);
      color: var(--primary-text);
      border-color: var(--primary-border);
    }

    .badge-priority.low {
      background: rgba(241, 245, 249, 0.85);
      color: var(--text-muted);
      border-color: var(--line-glass);
    }

    /* 任务卡片操作区 (圆边框矩形按钮) */
    .task-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.7;
      transition: opacity var(--duration) var(--ease);
    }

    .task-card:hover .task-actions {
      opacity: 1;
    }

    .action-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line-glass);
      border-radius: 10px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all var(--duration) var(--ease);
      outline: none;
    }

    .action-btn:hover {
      background: #ffffff;
      border-color: var(--line-border);
      color: var(--text-main);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .action-btn:focus-visible {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .action-btn.delete:hover {
      background: var(--danger-soft);
      border-color: var(--danger-border);
      color: var(--danger);
    }

    /* 内联任务编辑器 Editor */
    .editor {
      display: none;
      border-top: 1px solid var(--line-glass);
      background: #f7f9fc;
      padding: 12px 14px;
      gap: 10px;
    }

    .task-item.editing .editor {
      display: grid;
    }

    .editor input, .editor textarea {
      width: 100%;
      border: 1px solid var(--line-border);
      border-radius: 14px;
      background: #ffffff;
      color: var(--text-main);
      padding: 7px 10px;
      outline: 0;
      font-size: 12px;
      transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
    }

    .editor input:focus, .editor textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .editor textarea {
      min-height: 56px;
      resize: vertical;
      line-height: 1.4;
    }

    .editor-row { display: grid; gap: 8px; }

    .editor-priority {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .editor-priority-option {
      min-height: 30px;
      border: 1px solid var(--line-border);
      border-radius: 11px;
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 11px;
    }

    .editor-priority-option.selected {
      border-color: var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary-text);
      font-weight: 600;
    }

    .editor-btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }

    .btn {
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
      transition: all var(--duration) var(--ease);
      outline: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--line-focus);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line-border);
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background: #ffffff;
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: 1.5px solid var(--primary);
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: var(--shadow-md);
    }

    /* 空状态 Empty State */
    .empty-state {
      width: 100%;
      padding: 32px 16px;
      text-align: center;
      background: var(--bg-glass);
      border: 1px solid var(--line-glass);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      color: var(--text-secondary);
      margin-top: 6px;
      display: grid;
      place-items: center;
      gap: 8px;
    }

    .empty-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .empty-title {
      font-weight: 600;
      color: var(--text-main);
      font-size: 13.5px;
    }

    .empty-desc {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 240px;
    }

    /* Toast 通知与错误条 */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 10px 25px -3px rgba(15, 23, 42, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transform: translateY(120%);
      opacity: 0;
      transition: transform var(--duration) var(--ease), opacity var(--duration) var(--ease);
      z-index: 100;
      pointer-events: none;
    }

    .toast.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast.error {
      background: rgba(220, 38, 38, 0.95);
    }

    .loading-block {
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* 极小窗口自适应 */
    @media (max-width: 340px) {
      .shell { padding: 8px 8px 16px; }
      .progress-track, .status-percent { display: none; }
      .timeline { padding-left: 24px; }
      .timeline-line { left: 5px; }
      .timeline-node { left: -24px; width: 12px; height: 12px; }
      .tab { font-size: 11px; padding: 5px 2px; }
      .tab-count { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="window-toolbar" aria-label="窗口控制">
      <button class="window-drag-surface" id="windowDragSurface" type="button" aria-label="拖动悬浮窗" title="拖动悬浮窗">
        <span class="window-drag-mark" aria-hidden="true"></span>
      </button>
      <div class="window-actions">
        <button class="window-action active" type="button" data-window-action="topmost" aria-label="切换置顶" title="切换置顶" aria-pressed="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m6 11 6-6 6 6"></path><path d="M5 20h14"></path></svg>
        </button>
        <button class="window-action" type="button" data-window-action="collapse" aria-label="缩略窗口" title="缩略窗口">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <button class="window-action close-window" type="button" data-window-action="close" aria-label="关闭焦点清单" title="关闭焦点清单">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
        </button>
      </div>
    </div>

    <!-- 任务创建栏 -->
    <form class="composer" id="composer">
      <div class="composer-input-row">
        <input id="newTitle" type="text" maxlength="240" autocomplete="off" aria-label="任务标题">
        <button class="add-btn" type="submit" title="添加任务" aria-label="添加任务">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div class="composer-options">
        <label class="opt-pill" title="截止日期">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <input id="newDate" type="date" aria-label="截止日期">
        </label>
        <div class="priority-picker" id="priorityPicker">
          <input id="newPriority" type="hidden" value="normal">
          <button class="opt-pill priority-trigger" id="priorityTrigger" type="button" aria-label="优先级" aria-expanded="false" aria-controls="priorityMenu">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
            <span id="priorityText">普通</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="priority-menu" id="priorityMenu" role="listbox" aria-label="选择优先级" hidden>
            <button class="priority-option selected" type="button" data-priority="normal" role="option" aria-selected="true">普通</button>
            <button class="priority-option" type="button" data-priority="high" role="option" aria-selected="false">优先</button>
            <button class="priority-option" type="button" data-priority="low" role="option" aria-selected="false">低优先</button>
          </div>
        </div>
      </div>
    </form>

    <!-- 范围标签页 (圆边框矩形按钮组) -->
    <div class="tabs-wrapper">
      <nav class="tabs" aria-label="任务范围">
        <button class="tab active" data-scope="today" type="button">今天 <span class="tab-count" data-count="today">0</span></button>
        <button class="tab" data-scope="week" type="button">本周 <span class="tab-count" data-count="week">0</span></button>
        <button class="tab" data-scope="later" type="button">以后 <span class="tab-count" data-count="later">0</span></button>
        <button class="tab" data-scope="completed" type="button">完成 <span class="tab-count" data-count="completed">0</span></button>
        <button class="tab" data-scope="history" type="button">历史 <span class="tab-count" data-count="history">0</span></button>
      </nav>
    </div>

    <!-- 垂直时间线列表 -->
    <section class="timeline">
      <div class="timeline-line"></div>
      <div class="timeline-list" id="taskList">
        <div class="loading-block">正在加载垂直时间线…</div>
      </div>
    </section>

    <!-- 消息提示条 -->
    <div class="toast" id="toastMessage"></div>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const state = { activeScope: "today", snapshot: null, lastSnapshotStr: "", editingId: null, busy: false };
    const list = document.querySelector("#taskList");
    const toast = document.querySelector("#toastMessage");
    const titleInput = document.querySelector("#newTitle");
    const dateInput = document.querySelector("#newDate");
    const priorityInput = document.querySelector("#newPriority");
    const priorityPicker = document.querySelector("#priorityPicker");
    const priorityTrigger = document.querySelector("#priorityTrigger");
    const priorityMenu = document.querySelector("#priorityMenu");
    const priorityText = document.querySelector("#priorityText");
    const desktopBridge = window.chrome?.webview;
    const dragSurface = document.querySelector("#windowDragSurface");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-Focus-List-Token": token,
          ...(options.headers || {})
        }
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || `请求失败 (${response.status})`);
      return body;
    }

    function showToast(message, isError = false) {
      toast.textContent = message instanceof Error ? message.message : String(message);
      toast.className = `toast visible ${isError ? "error" : ""}`;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("visible"), 4000);
    }

    function dueLabel(task) {
      if (!task.dueDate) return "未定日期";
      if (!state.snapshot) return task.dueDate.slice(5).replace("-", "/");
      if (task.dueDate < state.snapshot.today && !task.completed) return `逾期 · ${task.dueDate.slice(5).replace("-", "/")}`;
      if (task.dueDate === state.snapshot.today) return "今天";
      if (task.dueDate === state.snapshot.weekEnd) return `周日 · ${task.dueDate.slice(5).replace("-", "/")}`;
      return task.dueDate.slice(5).replace("-", "/");
    }

    function priorityLabel(priority) {
      if (priority === "high") return "优先";
      if (priority === "low") return "低优先";
      return "普通";
    }

    function getNodeClass(task) {
      if (task.completed) return "node-completed";
      if (task.dueDate && state.snapshot && task.dueDate < state.snapshot.today) return "node-overdue";
      if (task.priority === "high") return "node-high";
      if (task.priority === "low") return "node-low";
      return "node-normal";
    }

    function setComposerPriority(priority) {
      priorityInput.value = priority;
      priorityText.textContent = priorityLabel(priority);
      priorityMenu.querySelectorAll(".priority-option").forEach(option => {
        const selected = option.dataset.priority === priority;
        option.classList.toggle("selected", selected);
        option.setAttribute("aria-selected", String(selected));
      });
    }

    function closePriorityPicker() {
      priorityPicker.classList.remove("open");
      priorityTrigger.setAttribute("aria-expanded", "false");
      priorityMenu.hidden = true;
    }

    function postWindowAction(action, event = {}) {
      desktopBridge?.postMessage({
        type: "window-action",
        action,
        screenX: Math.round(event.screenX || 0),
        screenY: Math.round(event.screenY || 0),
      });
    }

    function updateWindowControls(windowState) {
      const topmostButton = document.querySelector('[data-window-action="topmost"]');
      const topmost = Boolean(windowState?.topmost);
      topmostButton.classList.toggle("active", topmost);
      topmostButton.setAttribute("aria-pressed", String(topmost));
    }

    desktopBridge?.addEventListener("message", event => {
      if (event.data?.type === "window-state") updateWindowControls(event.data);
    });

    dragSurface.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      postWindowAction("drag", event);
    });

    document.querySelector(".window-actions").addEventListener("click", event => {
      const button = event.target.closest("[data-window-action]");
      if (button) postWindowAction(button.dataset.windowAction, event);
    });

    function taskMarkup(task) {
      const editing = state.editingId === task.id;
      const overdue = task.dueDate && state.snapshot && task.dueDate < state.snapshot.today && !task.completed;
      const isToday = task.dueDate && state.snapshot && task.dueDate === state.snapshot.today;
      const nodeClass = getNodeClass(task);

      return `
        <article class="task-item ${task.completed ? "completed" : ""} ${editing ? "editing" : ""}" data-id="${task.id}">
          <div class="timeline-node ${nodeClass}" title="${priorityLabel(task.priority)}"></div>
          <div class="task-card">
            <div class="task-main-row">
              <div class="checkbox-wrap">
                <input class="check" type="checkbox" ${task.completed ? "checked" : ""} aria-label="切换完成状态">
              </div>
              <div class="task-body" role="button" tabindex="0" aria-label="编辑任务">
                <div class="task-title">${escapeHtml(task.title)}</div>
                ${task.note ? `<div class="task-note-preview">${escapeHtml(task.note)}</div>` : ""}
                <div class="task-meta-bar">
                  <span class="badge badge-date ${overdue ? "overdue" : isToday ? "today" : ""}">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"></circle>
                      <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    ${escapeHtml(dueLabel(task))}
                  </span>
                  <span class="badge badge-priority ${task.priority}">${priorityLabel(task.priority)}</span>
                </div>
              </div>
              <div class="task-actions">
                <button class="action-btn edit-trigger" type="button" title="编辑任务" aria-label="编辑任务">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button class="action-btn delete" type="button" title="删除任务" aria-label="删除任务">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </div>
            <form class="editor">
              <input name="title" maxlength="240" value="${escapeHtml(task.title)}" placeholder="任务标题" required aria-label="任务标题">
              <div class="editor-row">
                <input name="dueDate" type="date" value="${task.dueDate || ""}" aria-label="截止日期">
                <div class="editor-priority" role="group" aria-label="优先级">
                  <input name="priority" type="hidden" value="${task.priority}">
                  <button class="editor-priority-option ${task.priority === "normal" ? "selected" : ""}" type="button" data-priority="normal">普通</button>
                  <button class="editor-priority-option ${task.priority === "high" ? "selected" : ""}" type="button" data-priority="high">优先</button>
                  <button class="editor-priority-option ${task.priority === "low" ? "selected" : ""}" type="button" data-priority="low">低优先</button>
                </div>
              </div>
              <textarea name="note" maxlength="4000" placeholder="添加备注或说明（可选）">${escapeHtml(task.note)}</textarea>
              <div class="editor-btn-row">
                <button class="btn btn-secondary cancel" type="button">取消</button>
                <button class="btn btn-primary save" type="submit">保存更改</button>
              </div>
            </form>
          </div>
        </article>`;
    }

    function render() {
      if (!state.snapshot) return;
      for (const [scope, count] of Object.entries(state.snapshot.counts)) {
        const target = document.querySelector(`[data-count="${scope}"]`);
        if (target) target.textContent = count;
      }
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.scope === state.activeScope));
      const tasks = state.snapshot.groups[state.activeScope] || [];
      if (tasks.length === 0) {
        let emptyTitle = "全部任务已完成";
        let emptyDesc = "当前时间段没有待处理任务，尽情享受专注时光。";
        if (state.activeScope === "completed") {
          emptyTitle = "暂无完成记录";
          emptyDesc = "完成的任务将归档显示在这里。";
        } else if (state.activeScope === "history") {
          emptyTitle = "暂无历史记录";
          emptyDesc = "过去日期的已完成和未完成任务都会保留在这里。";
        } else if (state.activeScope === "later") {
          emptyTitle = "未来暂无安排";
          emptyDesc = "本周之后的长期事项将列入此栏。";
        } else if (state.activeScope === "week") {
          emptyTitle = "本周清单已清空";
          emptyDesc = "本周内没有待办事项。";
        }
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
            </div>
            <div class="empty-title">${emptyTitle}</div>
            <div class="empty-desc">${emptyDesc}</div>
          </div>`;
        return;
      }
      list.innerHTML = tasks.map(taskMarkup).join("");
    }

    async function refresh({ quiet = false, force = false } = {}) {
      if (state.busy) return;
      try {
        const snapshot = await api("/api/snapshot");
        const snapshotStr = JSON.stringify(snapshot);
        if (!force && state.lastSnapshotStr === snapshotStr && !state.editingId) {
          return; // 数据完全未发生改变，不重新触发 DOM 渲染，杜绝任何跳动与闪烁
        }
        state.snapshot = snapshot;
        state.lastSnapshotStr = snapshotStr;
        if (state.editingId && !state.snapshot.tasks.some(task => task.id === state.editingId)) {
          state.editingId = null;
        }
        render();
      } catch (error) {
        if (!quiet) showToast(error, true);
      }
    }

    document.querySelector("#composer").addEventListener("submit", async event => {
      event.preventDefault();
      const title = titleInput.value.trim();
      if (!title || state.busy) return;
      state.busy = true;
      try {
        await api("/api/tasks", {
          method: "POST",
          body: JSON.stringify({ title, dueDate: dateInput.value || null, priority: priorityInput.value })
        });
        titleInput.value = "";
        await refresh({ force: true });
        titleInput.focus();
      } catch (error) {
        showToast(error, true);
      } finally {
        state.busy = false;
      }
    });

    priorityTrigger.addEventListener("click", event => {
      event.stopPropagation();
      const opening = priorityMenu.hidden;
      priorityPicker.classList.toggle("open", opening);
      priorityTrigger.setAttribute("aria-expanded", String(opening));
      priorityMenu.hidden = !opening;
    });

    priorityMenu.addEventListener("click", event => {
      const option = event.target.closest(".priority-option");
      if (!option) return;
      setComposerPriority(option.dataset.priority);
      closePriorityPicker();
      titleInput.focus();
    });

    document.addEventListener("click", event => {
      if (!priorityPicker.contains(event.target)) closePriorityPicker();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePriorityPicker();
    });

    document.querySelector(".tabs").addEventListener("click", event => {
      const tab = event.target.closest(".tab");
      if (!tab) return;
      state.activeScope = tab.dataset.scope;
      state.editingId = null;
      if (state.activeScope === "later") dateInput.value = "";
      else if (state.snapshot) dateInput.value = state.snapshot.today;
      render();
    });

    list.addEventListener("click", async event => {
      const taskElement = event.target.closest(".task-item");
      if (!taskElement || state.busy) return;
      const id = taskElement.dataset.id;
      const task = state.snapshot?.tasks?.find(item => item.id === id);
      if (!task) return;

      if (event.target.matches(".check")) {
        state.busy = true;
        try {
          await api(`/api/tasks/${id}`, { method: "PATCH", body: JSON.stringify({ completed: !task.completed }) });
          state.editingId = null;
          await refresh({ force: true });
        } catch (error) { showToast(error, true); }
        finally { state.busy = false; }
        return;
      }

      const editorPriority = event.target.closest(".editor-priority-option");
      if (editorPriority) {
        const editor = editorPriority.closest(".editor");
        editor.querySelector('input[name="priority"]').value = editorPriority.dataset.priority;
        editor.querySelectorAll(".editor-priority-option").forEach(option => {
          option.classList.toggle("selected", option === editorPriority);
        });
        return;
      }

      if (event.target.closest(".delete")) {
        if (!confirm(`确认删除“${task.title}”？`)) return;
        state.busy = true;
        try {
          await api(`/api/tasks/${id}`, { method: "DELETE" });
          state.editingId = null;
          await refresh({ force: true });
        } catch (error) { showToast(error, true); }
        finally { state.busy = false; }
        return;
      }

      if (event.target.closest(".task-body") || event.target.closest(".edit-trigger")) {
        state.editingId = state.editingId === id ? null : id;
        render();
        if (state.editingId) {
          const activeItem = list.querySelector(`[data-id="${id}"]`);
          activeItem?.querySelector('input[name="title"]')?.focus();
        }
        return;
      }

      if (event.target.closest(".cancel")) {
        state.editingId = null;
        render();
      }
    });

    list.addEventListener("keydown", event => {
      if ((event.key === "Enter" || event.key === " ") && event.target.closest(".task-body")) {
        event.preventDefault();
        event.target.closest(".task-body").click();
      }
    });

    list.addEventListener("submit", async event => {
      const editor = event.target.closest(".editor");
      if (!editor || state.busy) return;
      event.preventDefault();
      const taskElement = editor.closest(".task-item");
      const id = taskElement.dataset.id;
      const form = new FormData(editor);
      state.busy = true;
      try {
        await api(`/api/tasks/${id}`, {
          method: "PATCH",
          body: JSON.stringify({
            title: form.get("title"),
            dueDate: form.get("dueDate") || null,
            priority: form.get("priority"),
            note: form.get("note")
          })
        });
        state.editingId = null;
        await refresh({ force: true });
      } catch (error) { showToast(error, true); }
      finally { state.busy = false; }
    });

    refresh({ force: true }).then(() => { dateInput.value = state.snapshot?.today || ""; titleInput.focus(); });
    window.setInterval(() => { if (!state.editingId && !document.hidden) refresh({ quiet: true }); }, 2500);
  </script>
</body>
</html>
